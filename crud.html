<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 관리</title>
</head>
<body>
    <h1>게임 관리</h1>
        <h3>게임 추가</h3>
        <form id="gameForm">
                <fieldset>
                    <legend>기본 정보</legend>

                    <label for="name">게임 이름:</label><br>
                    <input type="text" id ="name" placeholder="게임이름을 입력하세요" required>
                    <br><br>
                    <label for="company">제작사:</label><br>
                    <input type =text id ="company" placeholder="제작사를 입력하세요" required>
                    <br><br>
                    <label for="price">가격:</label><br>
                    <input type="number" id="price" name="price" placeholder="(원)" required><br><br>

                    <label for="playtime">플레이타임:</label><br>
                    <input type="text" id="playtime" name="playtime" placeholder ="(시간)" required><br><br>
                    <br>
                    <button type="button" id="btn1">추가</button>
                </fieldset>
        
         
    </form>
    
    <h2>저장된 게임</h2>
    <table border="1">
        <thead>
        <tr>
            <th>ID</th>
            <th>게임 이름</th>
            <th>제작사</th>
            <th>가격</th>
            <th>플레이타임</th>
            <th>수정</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody id="gamelist"></tbody>

    </table>

    <script>
        let games = [
            {id:1,
             name : "리그오브레전드",
             company : "Riot Games",
            price : 0,
            playtime : 200 
            },
            {id:2,
             name : "마인크래프트",
             company : "Mojang",
            price : 10000,
            playtime : 400 
            },
            {id:3,
             name : "배틀그라운드",
             company : "PUBG",
            price : 0,
            playtime : 100 
            }
        ];

        console.log(games);

        let gamelist = document.getElementById("gamelist");

function render() {
    gamelist.innerHTML = "";

    games.forEach(function (game) {
        gamelist.innerHTML +=
            "<tr>" +
                "<td>" + game.id + "</td>" +
                "<td>" + game.name + "</td>" +
                "<td>" + game.company + "</td>" +
                "<td>" + game.price + "(원)" + "</td>" +
                "<td>" + game.playtime + "(시간)" + "</td>" +
                "<td>" +
                    "<button onclick='editGame(" + game.id + ")'>수정</button> " +
                "</td>" +
                "<td>" + "<button onclick='deleteGame(" + game.id + ")'>삭제</button>" +"</td>" +
            "</tr>";
    });
}

function editGame(id) {
    alert(id + "번 게임 수정");
}

function deleteGame(id) {
    alert(id + "번 게임 삭제");
}

render();
    </script>
</body>
</html>

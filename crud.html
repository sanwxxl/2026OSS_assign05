<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 관리</title>

    <style>
        body {
            font-family: "Malgun Gothic", sans-serif;
            background-color: #f5f6f8;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 16px;
            color: #333;
        }

        fieldset {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #4a7dff;
            outline: none;
        }

        #btn1 {
            background-color: #4a7dff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        #btn1:hover {
            background-color: #3462d9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        th {
            background-color: #f0f2f5;
        }
        
        .editBtn {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .deleteBtn {
            background-color: red;
            color: white;
            border: none;
            padding: 10px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>게임 관리</h1>
    <h3>게임 추가</h3>
    <form id="gameForm">
        <fieldset>
            <legend>기본 정보</legend>

            <label for="name">게임 이름:</label><br>
            <input type="text" id="name" placeholder="게임이름을 입력하세요" required maxlength="30">
            <br><br>
            <label for="company">제작사:</label><br>
            <input type="text" id="company" placeholder="제작사를 입력하세요" required>
            <br><br>
            <label for="price">가격:</label><br>
            <input type="number" id="price" name="price" placeholder="(원)" required min="0"><br><br>

            <label for="playtime">플레이타임:</label><br>
            <input type="number" id="playtime" name="playtime" placeholder="(시간)" required min="0"><br><br>
            <br>
            <button type="button" id="btn1">추가</button>
        </fieldset>


    </form>

    <h2>저장된 게임</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>게임 이름</th>
                <th>제작사</th>
                <th>가격</th>
                <th>플레이타임</th>
                <th>수정</th>
                <th>삭제</th>
            </tr>
        </thead>
        <tbody id="gamelist"></tbody>

    </table>

    <script>
        let games = [
            {
                id: 1,
                name: "리그오브레전드",
                company: "Riot Games",
                price: 0,
                playtime: 200
            },
            {
                id: 2,
                name: "마인크래프트",
                company: "Mojang",
                price: 10000,
                playtime: 400
            },
            {
                id: 3,
                name: "배틀그라운드",
                company: "PUBG",
                price: 0,
                playtime: 100
            }
        ];

        console.log(games);

        let gamelist = document.getElementById("gamelist");


        function render() {
            gamelist.innerHTML = "";

            games.forEach(function (game) {
                gamelist.innerHTML +=
                    "<tr>" +
                    "<td>" + game.id + "</td>" +
                    "<td>" + game.name + "</td>" +
                    "<td>" + game.company + "</td>" +
                    "<td>" + game.price + "(원)" + "</td>" +
                    "<td>" + game.playtime + "(시간)" + "</td>" +
                    "<td>" +
                    "<button class='editBtn' onclick='editGame(" + game.id + ")'>수정</button> " +
                    "</td>" +
                    "<td>" + "<button class='deleteBtn' onclick='deleteGame(" + game.id + ")'>삭제</button>" + "</td>" +
                    "</tr>";
            });
        }

        render();

        let gameForm = document.getElementById("gameForm");
        let nameInput = document.getElementById("name");
        let companyInput = document.getElementById("company");
        let priceInput = document.getElementById("price");
        let playtimeInput = document.getElementById("playtime");

        let btn1 = document.getElementById("btn1");

        let nextId = games.length + 1;

        let editingId = null;

        btn1.addEventListener("click", function () {
            if (!gameForm.reportValidity()) {
                return;
            }
            let name = nameInput.value;
            let company = companyInput.value;
            let price = Number(priceInput.value);
            let playtime = Number(playtimeInput.value);

            if (editingId === null) {
                games.push({
                    id: nextId,
                    name: name,
                    company: company,
                    price: price,
                    playtime: playtime
                });
                nextId++;
            } else {
                let game = games.find(function (game) {
                    return game.id === editingId;
                });

                game.name = name;
                game.company = company;
                game.price = price;
                game.playtime = playtime;

                editingId = null;
                btn1.textContent = "추가";
            }

            render();
            gameForm.reset();
        });

        function deleteGame(id) {
            if (confirm("삭제하시겠습니까?")) {
                games = games.filter(function (game) {
                    return game.id !== id;
                });

                if (editingId === id) {
                    editingId = null;
                    btn1.textContent = "추가";
                    gameForm.reset();
                }
                render();
            }
        }

        function editGame(id) {
            let game = games.find(function (game) {
                return game.id === id;
            });

            nameInput.value = game.name;
            companyInput.value = game.company;
            priceInput.value = game.price;
            playtimeInput.value = game.playtime;

            editingId = id;
            btn1.textContent = "저장";
        }

    </script>
</body>

</html>
